# Transcribe Configuration Example
# Copy this to ~/.transcribe/config.yaml and customize

# Directory to watch for new video files
watch_directory: /Users/yourusername/Movies

# Destination directory. One folder per meeting is created here.
# iCloud Drive and Google Drive are both recognised; the Slack link adapts to
# whichever the destination lives in.
destination_directory: /Users/yourusername/Library/Mobile Documents/com~apple~CloudDocs/Meetings

# LLM provider for notes, summaries, titles, and action items.
# One of: claude (default, uses Anthropic) | openai
llm_provider: claude

# Anthropic (Claude) settings -- used when llm_provider is "claude" (default).
# Get a key at: https://console.anthropic.com/
anthropic_api_key: sk-ant-your-api-key-here
anthropic_model: claude-haiku-4-5-20251001

# OpenAI settings -- used when llm_provider is "openai".
# Get yours at: https://platform.openai.com/api-keys
openai_api_key: sk-your-api-key-here
openai_model: gpt-4o-mini

# Point the "openai" provider at any OpenAI-compatible endpoint -- a LiteLLM
# gateway, Ollama, vLLM, LM Studio, OpenRouter. Leave empty for api.openai.com.
openai_base_url: ""
# openai_base_url: https://litellm.example.com   # LiteLLM gateway
# openai_base_url: http://localhost:11434/v1     # Ollama

# LLM call timeouts and retry strategy
llm_timeout_seconds: 600
llm_max_retries: 2

# Reasoning models spend completion tokens on their chain of thought, so give
# them headroom or these steps come back empty. You are only charged for what
# is actually generated.
boundary_max_tokens: 8000
speaker_max_tokens: 16000
notes_max_tokens: 16000

# Slack webhook URL for notifications
# Create one at: https://api.slack.com/messaging/webhooks
slack_webhook_url: https://hooks.slack.com/services/YOUR/WEBHOOK/URL
# slack_bot_token: xoxb-...
# slack_channel_id: C01234567890

# Video file extensions to process
video_extensions:
  - .mov
  - .mp4
  - .avi
  - .mkv
  - .m4v

# --- Transcription ----------------------------------------------------------

# Whisper ggml model name (resolves to ggml-<name>.bin), auto-downloaded to
# ~/.whisper-models/ if missing. large-v3-turbo is the accuracy/speed sweet spot
# on Apple Silicon; use "base" if you want something small and fast.
whisper_model: large-v3-turbo

# Voice Activity Detection. Leave this on. Recordings usually contain long
# stretches of room tone rather than digital silence, and fed that, Whisper
# hallucinates filler ("Thank you." on repeat) and can lock into a repetition
# loop that ruins every following hour.
whisper_vad: true
whisper_vad_threshold: 0.5
whisper_suppress_non_speech: true
whisper_language: en
whisper_threads: 8

# Optional initial prompt biasing the decoder toward your vocabulary. Improves
# proper nouns and technical jargon noticeably.
# Seed vocabulary, not a list to maintain. Whisper caps the initial prompt at
# 224 tokens, so it cannot simply accumulate; the prompt is assembled per
# recording from the calendar event (title, attendees), a glossary mined from
# your own past notes, and this seed, then fitted to the budget by priority.
# Corrections the notes step makes are fed back in, so a term misheard once is
# primed correctly next time.
whisper_prompt: ""
whisper_auto_prompt: true
whisper_prompt_token_budget: 190
# whisper_prompt: "Terraform, Kubernetes, MikroTik, BGP, IPsec, Cloudflare"

# --- Meetings ---------------------------------------------------------------

# Split a recording into the separate meetings it contains, writing one folder
# of notes per meeting. Set false for the original flat behaviour (one
# transcript and summary per file).
meeting_mode: true
split_meetings: true

# Also cut the source video into one clip per meeting (lossless stream copy).
split_video: true

# Move the source recording out of the watch folder once processing succeeds.
move_source_video: true

# A pause at least this long is a candidate boundary between meetings.
meeting_gap_seconds: 180
min_meeting_seconds: 120

# --- Speaker attribution ----------------------------------------------------

# Local voice clustering via sherpa-onnx (~46 MB of ONNX models, no PyTorch).
# Needs: pip install 'transcribe[diarize]'
diarization_enabled: true
# Cosine-distance threshold for merging voices. Higher merges more; lower splits
# more. Raise it if one person is reported as several speakers, lower it if two
# people are merged into one.
diarization_threshold: 0.8

# Segmentation window step, as a fraction of the window length. Lower is slower
# for no measurable gain in quality.
diarization_window_shift_ratio: 0.25

# The slowest local stage on a long meeting. Roughly 4 MB of RAM per minute of audio.
diarization_threads: 8

# Names that recur in your meetings. Helps map voices to real people when no
# calendar attendee list is available.
known_participants: []
# known_participants:
#   - Sam Okoro
#   - Priya Nair

# --- Calendar ---------------------------------------------------------------

# Match the recording against calendar events for real meeting titles and
# attendee lists. Reads whatever accounts Calendar.app already syncs.
# Needs: pip install 'transcribe[calendar]', then: transcribe calendar-check
calendar_enabled: true
calendar_source: macos
calendar_margin_minutes: 15

# Where a Slack "Open iCloud Drive" link points. iCloud Drive has no
# path-addressable web URL -- share links are minted by a person sharing an
# item, not by an API -- so this cannot deep-link to the meeting folder the way
# a Google Drive link can. The folder path is shown alongside it.
icloud_base_url: https://www.icloud.com/iclouddrive/

# --- Auto-recording (transcribe autorecord) ----------------------------------

# Start/stop an OBS recording when a meeting starts and ends.
# Needs: pip install 'transcribe[autorecord]' and OBS > Tools > WebSocket Server Settings enabled.
# A recording needs the microphone AND one corroborating signal.

autorecord_require_camera: true
autorecord_use_calendar: true

# Opt-in, and noisy: recording on microphone activity alone is what makes
# always-on capture feel unhinged.
autorecord_mic_only: false

# Virtual/loopback cameras that report as running whenever their host app is open
autorecord_ignored_cameras: []

# How often to check for audio/camera activity
autorecord_poll_seconds: 5

# How long the mic must be held before recording starts. Long enough that a
# notification chime or a "can you hear me" does not produce a file.
autorecord_start_after_seconds: 45

# How long it must be released before recording stops. Long enough that
# swapping a headset does not chop a meeting in two.
autorecord_stop_after_seconds: 120

# Refuse to start below this much free space: a truncated recording on a
# full disk loses the meeting entirely.
autorecord_min_free_gb: 10

# Virtual/loopback inputs that report as running whenever their host app is open.
# Empty means use the built-in list.
autorecord_ignored_devices: []

# OBS WebSocket Server settings
obs_host: localhost  # checkov:skip=DS162092:example config — localhost is the correct default for a local OBS WebSocket connection; OBS runs on the same machine
obs_port: 4455
obs_password: ""
