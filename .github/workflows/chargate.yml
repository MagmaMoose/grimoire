name: Chargate

# Dogfood the user's own security gate: chargate runs as a reusable workflow on
# every PR (net-new MegaLinter + secret scanning). Pinned by floating major tag
# (magmamoose/chargate@v2) so it tracks the latest stable v2.x.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  security:
    uses: magmamoose/chargate/.github/workflows/gate.yml@d61ef64002a07656eaa949e2a39fe6a541fa7073 # v2.11.45
