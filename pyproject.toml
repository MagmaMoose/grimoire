[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transcribe"
version = "1.1.0"
description = "Video/audio transcription tool with auto-watch, OpenAI summarization, and Slack notifications"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Caleb Sargeant" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
]
dependencies = [
    "pyyaml>=6.0",
    "watchdog>=3.0.0",
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
gdrive = [
    "google-auth>=2.0.0",
    "google-api-python-client>=2.0.0",
]
# Local speaker attribution. ONNX only -- no PyTorch, no model gating.
diarize = [
    "sherpa-onnx>=1.10.0",
    "numpy>=1.24",
]
# macOS Calendar lookup for meeting titles and attendee lists.
calendar = [
    "pyobjc-framework-EventKit>=10.0",
]
# Automatic recording: detects meetings by microphone activity and drives OBS.
autorecord = [
    "obsws-python>=1.6",
]
# Menu bar app: manual override and a view of what the detector can see.
menubar = [
    "obsws-python>=1.6",
    "rumps>=0.4",
]
all = [
    "transcribe[gdrive,diarize,calendar,autorecord,menubar]",
]

[project.scripts]
transcribe = "transcribe.cli:main"

[dependency-groups]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.5.34",
    "pymdown-extensions==10.9",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    # Exercised by the diarization tests; the ONNX runtime itself is not needed.
    "numpy>=1.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/transcribe"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
