name: Transcribe
options:
  bundleIdPrefix: com.magmamoose
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    # Ad-hoc signing. Distributing to anyone else needs a Developer ID and
    # notarisation, which is a separate piece of work.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO

targets:
  Transcribe:
    type: application
    platform: macOS
    sources:
      - path: Transcribe
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magmamoose.transcribe
        PRODUCT_NAME: Transcribe
        INFOPLIST_FILE: Transcribe/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The app reads meeting folders the user picks, which can live in
        # iCloud Drive or anywhere else, so it is not sandboxed. Sandboxing it
        # would mean a security-scoped bookmark for the meetings folder and
        # would still not let it drive the CLI.
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_ENTITLEMENTS: Transcribe/Resources/Transcribe.entitlements
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
      configs:
        Release:
          # Ad-hoc signing makes Xcode inject com.apple.security.get-task-allow,
          # which lets any process attach a debugger to the shipped app. It is a
          # debug entitlement and has no business in a Release build.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    scheme:
      # Without this the autocreated scheme runs zero tests and still reports
      # success.
      testTargets:
        - TranscribeTests

  TranscribeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Transcribe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magmamoose.transcribe.tests
        GENERATE_INFOPLIST_FILE: YES
